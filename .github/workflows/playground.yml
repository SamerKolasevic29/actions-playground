name: Playground

on:
  push:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        id: tests
        run: node --test

      - name: samo ako je proslo
        if: success()
        run: echo "Testovi su prosli"

      - name: Samo ako je palo
        if: failure()
        run: echo "Testovi su pali, ovo je else fakticki"

      - name: Uvijek
        if: always()
        run: echo "Ishod testova je ${{ steps.tests.outcome }}"

      - name: Samo na main
        if: github.ref_name == 'main'
        run: echo "Ovo ce se vidjeti samo na main grani"

      - name: Samo na feature granama
        # startsWith(ko_pocinje, kako_pocinje)
        if: startsWith(github.ref_name, 'feature/')
        run: echo "Ovo je feature grana"

    tolerated:
      runs-on: ubuntu-latest
      steps:
        - name: Pada ali je tolerisano
          id: risky
          continue-on-error: true
          run: exit 1

        - name: Ishod
          run: |
            echo "outcome: ${{ steps.risky.outcome }}"
            echo "conclusion: ${{ steps.risky.conclusion }}"
